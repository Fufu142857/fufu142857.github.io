<body>
  <div class="vim-gui" id="vim-container" tabindex="0">

  <div class="vim-bar top">
    <div class="item bg-purple arrow-right z5">1: death_studies.md</div>
    <div class="item bg-dark text-gray arrow-right z4">2: cv_research.md</div>
    <div class="spacer bg-void z3"></div>

  <div class="vim-body">
    <div id="vim-cursor"></div>
    <article class="vim-content" id="main-buffer">
      <h1 class="vim-block"><span class="token-purple">#</span> CG学习过程</h1>
      <div id="text-layer"><h1 id="record">Record</h1>

<p>有仪式感地督促自己学习.</p>

<blockquote>
  <p>Somebody can make something beautiful out of nothing.</p>
</blockquote>
</div>
      <div class="vim-block eof">~</div>
    </article>
  </div>

  <div class="vim-bar bottom-status">
    <div class="item bg-violet arrow-right bold z10">NORMAL</div>
    <div class="item bg-blue arrow-right z9">master*</div>
    <div class="item bg-dark arrow-right z8">readme.md</div>
    <div class="item bg-deep arrow-right readonly z7">[+]</div>

    <div class="spacer bg-deep z6"></div>

    <div class="item bg-deep arrow-left z7">utf-8</div>

  </div>

  <div class="vim-cmd-line">
    fufu@142857:~/CG_study/readme.md $ <span id="cmd-cursor" class="blink-block">_</span>
  </div>

  <div id="telescope-overlay" class="hidden">
    <div class="telescope-box">
      <div class="tele-header">Telescope > find_headers</div>
      <ul id="tele-list"></ul>
    </div>
  </div>

  <div id="file-menu-overlay" class="hidden">
    <div class="telescope-box" style="width: 600px; max-width: 90vw;">
      <div class="tele-header">Directory > files</div>
      <ul id="file-menu-list"></ul>
    </div>
  </div>

</div>

<script markdown="0">
const cvList = [
{ title: "Reflectance &amp; Lighting", url: "/CV_study/05-Reflec&Lighting.html" },{ title: "Filters", url: "/CV_study/06-Filters.html" },{ title: "Interactive Segmentation &amp; Graph-Cut", url: "/CV_study/07-InterSeg-GraphCut.html" },{ title: "Feature Detector &amp; Descriptor", url: "/CV_study/08-Feature.html" },{ title: "Homography", url: "/CV_study/09-Homography.html" },{ title: "谭平-Computer Visition", url: "/CV_study/1-4-PingTan_CV_Note.html" },{ title: "Geometry &amp; Camera Model", url: "/CV_study/10-Geometry&CameraModel.html" },{ title: "Calibration &amp; 2-View Geometry", url: "/CV_study/11-Calibration&2-ViewGeometry.html" },{ title: "Structure-from-Motion (SfM)", url: "/CV_study/12-Structure-from-Motion.html" },{ title: "SLAM Simultaneous Localization And Mapping", url: "/CV_study/13-SLAM.html" },{ title: "Stereo &amp; Optical Flow", url: "/CV_study/14-Stereo&OpticalFlow.html" },{ title: "Bag-of-Words", url: "/CV_study/15-Beg-of-Words.html" },{ title: "Classification", url: "/CV_study/16-Classification.html" },{ title: "卷积神经网络 CNN", url: "/CV_study/17-CNN.html" },{ title: "Detection &amp; Segmentation", url: "/CV_study/18-Detection&Segmentation.html" },{ title: "CV学习过程", url: "/CV_study/readme.html" }
];
const cgList = [
{ title: "Introduction", url: "/CG_study/01-Introduction.html" },{ title: "Review of Linear Algebra", url: "/CG_study/02-ReviewOfLinearAlgebra.html" },{ title: "Transformation", url: "/CG_study/03-Transformation.html" },{ title: "Transformation Cont.", url: "/CG_study/04-TransformationCont.html" },{ title: "Rasterization 1 (Triangles)", url: "/CG_study/05-Rasterization1-Triangles.html" },{ title: "Rasterization 2 (Antialiasing and Z-Buffering)", url: "/CG_study/06-Rasterization2-Antialiasing&Z-Buffering.html" },{ title: "Shading 1 (illumination, Shading and Graphics Pipeline)", url: "/CG_study/07-Shading1-IlluminationShading&GraphicsPipeline.html" },{ title: "Shading 2 (Shading, Pipeline and Texture Mapping)", url: "/CG_study/08-Shading2-ShadingPipeline&TextureMapping.html" },{ title: "Shading 3 (Texture Mapping cont.)", url: "/CG_study/09-Shading3-TextureMappingCont.html" },{ title: "Geometry 1 (Introduction)", url: "/CG_study/10-Geometry1-Introduction.html" },{ title: "Geometry 2 (Curves and Surfaces)", url: "/CG_study/11-Geometry2-Curves&Surfaces.html" },{ title: "Geometry 3", url: "/CG_study/12-Geometry3.html" },{ title: "Ray Tracing 1 (Whitted-Style Ray Tracing)", url: "/CG_study/13-RayTracing1-Whitted-StyleRayTracing.html" },{ title: "Ray Tracing 2 (Acceleration &amp; Radiometry)", url: "/CG_study/14-RayTracing2-Acceleration&Radiometry.html" },{ title: "Ray Tracing 3 (Light Transport &amp; Global Illumination)", url: "/CG_study/15-RayTracing3-LightTransport&GlobalIllumination.html" },{ title: "Ray Tracing 4 (Monte Carlo Path Tracing)", url: "/CG_study/16-RayTracing4-MonteCarloPathTracing.html" },{ title: "Materials and Appearances", url: "/CG_study/17-Materials&Appearances.html" },{ title: "Advanced Topics in Rendering", url: "/CG_study/18-AdvancedTopicsInRendering.html" },{ title: "Cameras, Lenses and Light Fields", url: "/CG_study/19-CamerasLenses&LightFields.html" },{ title: "Color and Perception", url: "/CG_study/20-Color&Perception.html" },{ title: "Animation", url: "/CG_study/21-Animation.html" },{ title: "Animation (cont.)", url: "/CG_study/22-AnimationCont.html" },{ title: "CG学习过程", url: "/CG_study/readme.html" }
];
const isCV = window.location.href.includes('CV_study');
const currentList = isCV ? cvList : cgList;
let fileMenuOpen = false;
let fileSelectedIndex = 0;
const fileOverlay = document.getElementById('file-menu-overlay');
const fileMenuList = document.getElementById('file-menu-list');
function renderFileMenu() {
fileMenuList.innerHTML = '';
currentList.forEach((f, idx) => {
let li = document.createElement('li');
li.innerText = f.title;
if (idx === fileSelectedIndex) {
li.style.color = '#ffdd99';
li.style.borderLeft = '2px solid #ffdd99';
li.style.paddingLeft = '8px';
}
li.onclick = () => { window.location.href = f.url; }
fileMenuList.appendChild(li);
});
}
function toggleFileMenu() {
fileMenuOpen = !fileMenuOpen;
if (fileMenuOpen) {
fileOverlay.className = '';
renderFileMenu();
} else {
fileOverlay.className = 'hidden';
}
}
let allTextNodes = []; 
let currentNodeIdx = 0; 
let currentOffset = 0;  
const cursor = document.getElementById('vim-cursor');
const posDisplay = document.getElementById('cursor-pos');
const cmdCursor = document.getElementById('cmd-cursor');
window.onload = function() {
const walker = document.createTreeWalker(document.getElementById('main-buffer'), NodeFilter.SHOW_TEXT, null, false);
let node;
while(node = walker.nextNode()) {
if(node.nodeValue.trim().length > 0) allTextNodes.push(node);
}
updateCursor();
}
function updateCursor() {
if (allTextNodes.length === 0) return;
const textNode = allTextNodes[currentNodeIdx];
const textLen = textNode.nodeValue.length;
if (currentOffset >= textLen) currentOffset = textLen - 1;
if (currentOffset < 0) currentOffset = 0;
const range = document.createRange();
try {
range.setStart(textNode, currentOffset);
range.setEnd(textNode, currentOffset + 1);
} catch(e) { return; }
const rect = range.getBoundingClientRect();
if (rect.width === 0) return;
const bodyRect = document.querySelector('.vim-body').getBoundingClientRect();
cursor.style.width = `${rect.width}px`;
cursor.style.height = `${rect.height}px`;
cursor.style.transform = `translate(${rect.left - bodyRect.left}px, ${rect.top - bodyRect.top}px)`;
cursor.style.opacity = 0.5;
posDisplay.innerText = `${currentNodeIdx + 1}:${currentOffset + 1}`;
if (rect.top > window.innerHeight - 80) window.scrollBy(0, 40);
if (rect.top < 80) window.scrollBy(0, -40);
}
function focusMainBuffer() {
cmdCursor.classList.remove('blink-block');
cmdCursor.classList.add('solid-block');
cmdCursor.style.opacity = 0.3; 
}
document.addEventListener('keydown', (e) => {
if (e.metaKey || e.ctrlKey || e.altKey) return;
focusMainBuffer();
if (fileMenuOpen) {
if (e.key === 'Escape') { toggleFileMenu(); return; }
if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); fileSelectedIndex = (fileSelectedIndex + 1) % currentList.length; renderFileMenu(); return; }
if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); fileSelectedIndex = (fileSelectedIndex - 1 + currentList.length) % currentList.length; renderFileMenu(); return; }
if (e.key === 'Enter') { e.preventDefault(); window.location.href = currentList[fileSelectedIndex].url; return; }
return;
}
const textNode = allTextNodes[currentNodeIdx];
const len = textNode ? textNode.nodeValue.length : 0;
switch(e.key) {
case ' ': e.preventDefault(); toggleFileMenu(); break;
case 'Tab': 
e.preventDefault();
if (isCV) window.location.href = "/CG_study/10-Geometry1-Introduction";
else window.location.href = "/CV_study/1-4-PingTan_CV_Note";
break;
case 'H':
if (e.shiftKey) {
let idx = currentList.findIndex(f => window.location.href.includes(f.url));
if (idx > 0) window.location.href = currentList[idx - 1].url;
}
break;
case 'l': 
if (currentOffset < len - 1) currentOffset++;
else if (currentNodeIdx < allTextNodes.length - 1) { currentNodeIdx++; currentOffset = 0; }
updateCursor(); break;
case 'h': 
if (currentOffset > 0) currentOffset--;
else if (currentNodeIdx > 0) { currentNodeIdx--; currentOffset = allTextNodes[currentNodeIdx-1].nodeValue.length - 1; }
updateCursor(); break;
case 'j': 
if (currentNodeIdx < allTextNodes.length - 1) { currentNodeIdx++; currentOffset = 0; updateCursor(); } break;
case 'k': 
if (currentNodeIdx > 0) { currentNodeIdx--; currentOffset = 0; updateCursor(); } break;
case '0': window.location.href = "/"; break;
case 'm': e.preventDefault(); toggleMenu(true); break;
case 'L': 
if (e.shiftKey) {
let idx = currentList.findIndex(f => window.location.href.includes(f.url));
if (idx !== -1 && idx < currentList.length - 1) window.location.href = currentList[idx + 1].url;
}
break;
}
});
const overlay = document.getElementById('telescope-overlay');
function toggleMenu(state) { if(overlay) overlay.className = state ? '' : 'hidden'; }
document.addEventListener('keydown', e => { if(e.key==='Escape') toggleMenu(false); });
const headers = document.querySelectorAll('.vim-content h2, .vim-content h3');
const list = document.getElementById('tele-list');
if(list && headers.length > 0) {
headers.forEach(h => {
let li = document.createElement('li');
li.innerText = h.innerText;
li.onclick = () => { h.scrollIntoView({behavior:'smooth'}); toggleMenu(false); }
list.appendChild(li);
});
}
window.addEventListener('scroll', () => {
const docHeight = document.body.scrollHeight - window.innerHeight;
const per = Math.round((window.scrollY / docHeight) * 100);
const el = document.getElementById('scroll-per');
if(el) el.innerText = (window.scrollY===0)?'TOP':(per>=99?'BOT':per+'%');
});
</script>

</body>
